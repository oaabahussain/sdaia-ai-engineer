name: Export source snapshot
on:
  push:
    branches:
      - tmp/programme-a-snapshot
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: programme-a-source
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
          retention-days: 1
      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: programme-a-node-modules
          path: node_modules
          include-hidden-files: true
          retention-days: 1
