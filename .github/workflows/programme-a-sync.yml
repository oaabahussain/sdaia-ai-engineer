name: Programme A sync
on:
  push:
    branches: [tmp/programme-a-sync]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconstruct verified implementation patch
        shell: bash
        run: |
          set -euo pipefail
          parts=(.programme-a-sync/v3-{00..10}.b64)
          test "${#parts[@]}" -eq 11
          for f in "${parts[@]}"; do
            test -s "$f"
            LC_ALL=C grep -Eq '^[A-Za-z0-9+/=]+$' "$f"
          done
          cat "${parts[@]}" | base64 -d | xz -d > /tmp/programme-a.patch
          echo "7e2700f4176e4c23252493116d9e160a91486d8c3f028f8d11a753210b60c9d4  /tmp/programme-a.patch" | sha256sum -c -
      - name: Apply to real design head and push implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach e269c6be411b849637967c5224c816f6c8af5b02
          git apply --index /tmp/programme-a.patch
          git diff --cached --check
          test -f src/content/runtimeBundle.js
          test -f tracks/sdaia-ai-engineer/manifest.json
          test -f tests/runtime-bundle.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: stabilise learning platform runtime contracts"
          git push origin HEAD:refs/heads/impl/programme-a-contract-stabilisation
