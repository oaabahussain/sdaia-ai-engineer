name: Daily question review proposal

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: npm ci --ignore-scripts
      - name: Validate LLM configuration
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$LLM_PROVIDER" ]; then echo 'LLM_PROVIDER repository variable is required'; exit 1; fi
          if [ -z "$LLM_MODEL" ]; then echo 'LLM_MODEL repository variable is required'; exit 1; fi
          if [ -z "$LLM_API_KEY" ]; then echo 'LLM_API_KEY repository secret is required'; exit 1; fi
          if [ "$LLM_PROVIDER" != 'openai' ] && [ "$LLM_PROVIDER" != 'anthropic' ]; then echo 'LLM_PROVIDER must be openai or anthropic'; exit 1; fi
      - name: Review reported questions
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/agent/review_agent.py
