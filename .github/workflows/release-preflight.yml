name: Server-ready release preflight

on:
  push:
    branches: [server-ready-preflight]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          pip install -r server/requirements.txt
      - name: Validate data and schemas
        run: node scripts/validate.js
      - name: Node tests
        run: node --test tests/*.test.js
      - name: Browser adapter contract
        run: node scripts/contract_test.js browser
      - name: Verify release HTML
        run: |
          set -euo pipefail
          node scripts/verify_html.js index.html
          python3 scripts/verify_release.py index.html
      - name: Lint OpenAPI
        run: npx redocly lint api/openapi.yaml
      - name: Server tests
        env:
          DB_URL: sqlite:///./preflight.db
          PYTHONPATH: server
        run: pytest -q server/tests
      - name: Database smoke
        run: python3 scripts/db_smoke.py
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(node_modules/|.*\.db$|.*__pycache__/|.*\.pytest_cache/)'; then
            echo 'Forbidden generated files are tracked'
            exit 1
          fi
          if grep -R -n --fixed-strings '|| true' .github/workflows scripts src server; then
            echo 'Forbidden || true found'
            exit 1
          fi
          if grep -R -n --fixed-strings 'continue-on-error: true' .github/workflows; then
            echo 'Forbidden continue-on-error found'
            exit 1
          fi
          count="$(grep -cE 'localStorage|fetch\(' src/app.js || printf '0')"
          test "$count" -eq 0
          echo 'Repository hygiene: PASS'
