name: Server-ready release preflight

on:
  push:
    branches: [server-ready-clean]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          pip install -r server/requirements.txt
      - name: Verify Task A state contract
        run: |
          set -euo pipefail
          node scripts/validate.js --state tests/fixtures/state.sample.json
          if grep -nE 'state\.(answers|review|bookmarks|settings)\b' src/app.js; then exit 1; fi
          echo 'duplicate state fields in app.js: 0'
      - name: Verify Task B logic integration
        run: |
          set -euo pipefail
          grep -nE "from './logic/(mastery|readiness|review|mission)\.js'" src/app.js
          if grep -nF 'pts+=' src/app.js; then exit 1; fi
          echo 'pts+= occurrences: 0'
          if grep -nF '[1,3,7,14]' src/app.js; then exit 1; fi
          echo '[1,3,7,14] occurrences: 0'
      - name: Verify Tasks C and D logic behavior
        run: node --test tests/*.test.js
      - name: Verify Task E service worker assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-180.png icon-192.png icon-512.png _site/
          cp -R src data _site/
          grep -n "sdaia-ai-pages-v6\|./src/app.js\|./data/questions.json" sw.js
          node scripts/verify_sw_assets.js _site
      - name: Verify Task F configurable LLM review
        shell: bash
        run: |
          set -euo pipefail
          grep -nE 'vars.LLM_PROVIDER|vars.LLM_MODEL|secrets.LLM_API_KEY' .github/workflows/daily-review.yml
          grep -n "PROVIDER not in {'openai', 'anthropic'}" .github/agent/review_agent.py
          python3 -m py_compile .github/agent/review_agent.py
          if grep -R -nE 'gpt-[0-9]|claude-[0-9]|OPENAI_MODEL|OPENAI_API_KEY' .github/workflows/daily-review.yml .github/agent/review_agent.py; then exit 1; fi
          echo 'hardcoded provider model/key names: 0'
      - name: Validate full public bank and HTML
        run: |
          set -euo pipefail
          node scripts/validate.js
          node scripts/contract_test.js browser
          node scripts/verify_html.js index.html
          python3 scripts/verify_release.py index.html
          npx redocly lint api/openapi.yaml
      - name: Verify API adapter contract
        shell: bash
        env:
          DB_URL: sqlite:///./contract-preflight.db
          PYTHONPATH: server
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --app-dir server --host 127.0.0.1 --port 8000 > /tmp/sdaia-api.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          SDAIA_API_BASE=http://127.0.0.1:8000/v1 node scripts/contract_test.js api
      - name: Server and database tests
        env:
          DB_URL: sqlite:///./preflight.db
          PYTHONPATH: server
        run: |
          set -euo pipefail
          pytest -q server/tests
          python3 scripts/db_smoke.py
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(node_modules/|.*\.db$|.*__pycache__/|.*\.pytest_cache/)'; then echo 'Forbidden generated files are tracked'; exit 1; fi
          policy_key='continue-on-error:'
          if git grep -n "$policy_key true" -- '.github/workflows'; then echo 'Forbidden workflow error bypass found'; exit 1; fi
          if grep -nE 'localStorage|fetch\(' src/app.js; then echo 'Direct storage/network access found in app.js'; exit 1; fi
          echo 'app direct storage/fetch count: 0'
          echo 'FULL PREFLIGHT: PASS'
