name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify source release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py index.html
          source_sha="$(sha256sum index.html | awk '{print $1}')"
          echo "SOURCE_INDEX_SHA256=$source_sha"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live release
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          source_sha="$(sha256sum index.html | awk '{print $1}')"
          live_sha=""
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --output live-index.html "${PAGE_URL}?verify=${GITHUB_SHA}-${attempt}"
            python3 scripts/verify_release.py live-index.html --html-only
            live_sha="$(sha256sum live-index.html | awk '{print $1}')"
            echo "LIVE_INDEX_SHA256=$live_sha"
            if [ "$live_sha" = "$source_sha" ]; then
              echo "Live index matches the deployed source."
              exit 0
            fi
            echo "Live index is not current yet; retrying in 5 seconds."
            sleep 5
          done
          echo "Live index SHA-256 did not match source after retries."
          exit 1
