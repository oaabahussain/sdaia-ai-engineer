name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-tests-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate canonical track contracts
        run: npm run validate
      - name: Run Node tests
        run: npm test
      - name: Browser smoke test
        run: python3 scripts/browser_smoke.py
      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html feedback.html manifest.webmanifest sw.js icon.svg icon-180.png icon-192.png icon-512.png _site/
          cp -R src tracks _site/
          mkdir -p _site/data
          cp -R data/concepts data/migrations _site/data/
          cp data/learn.json data/cases.json _site/data/
          test ! -e _site/data/legacy
          touch _site/.nojekyll
          node --check _site/src/app.js
          node scripts/verify_html.js _site/index.html
          node scripts/verify_sw_assets.js _site
          source_sha="$(sha256sum _site/index.html | awk '{print $1}')"
          echo "SOURCE_INDEX_SHA256=$source_sha"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(sha256sum _site/index.html | awk '{print $1}')"
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --output live-index.html "${PAGE_URL}?verify=${GITHUB_SHA}-${attempt}"
            live_sha="$(sha256sum live-index.html | awk '{print $1}')"
            echo "LIVE_INDEX_SHA256=$live_sha"
            if [ "$live_sha" = "$source_sha" ]; then break; fi
            if [ "$attempt" -eq 12 ]; then echo 'Live index SHA mismatch'; exit 1; fi
            sleep 5
          done
          curl --fail --silent --show-error --location --output live-app.js --write-out 'LIVE_APP_HTTP=%{http_code}\n' "${PAGE_URL}src/app.js?verify=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --output live-feedback.html --write-out 'LIVE_FEEDBACK_HTTP=%{http_code}\n' "${PAGE_URL}feedback.html?verify=${GITHUB_SHA}"
          grep -q 'id="feedbackGrid"' live-feedback.html
          node scripts/verify_live_release.js "${PAGE_URL}"
