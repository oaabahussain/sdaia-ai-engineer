name: Server-ready foundation builder

on:
  push:
    branches: [server-ready-bootstrap]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v6
        with:
          ref: server-ready-bootstrap
          fetch-depth: 0

      - name: Fetch target branch
        run: git fetch origin server-ready-foundation

      - name: Prepare patched builder copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/agent/server_ready_builder.py')
          s = source.read_text(encoding='utf-8')
          s = s.replace("التخزين المحلي متاح، مع fallback داخل الذاكرة عند تعذر localStorage", "التخزين المحلي متاح، مع fallback داخل الذاكرة عند تعذر التخزين الدائم")
          s = s.replace("node --test tests/", "node --test tests/*.test.js")
          s = s.replace("run(\"test $(grep -cE 'localStorage|fetch\\\\(' src/app.js || true) -eq 0\")", "run(\"python3 -c \\\"from pathlib import Path; s=Path('src/app.js').read_text(); assert 'localStorage' not in s and 'fetch(' not in s; print('direct storage/fetch references: PASS (0)')\\\"\")")
          s = s.replace("    run(\"git add -A\")", "    run(\"git add -A -- . ':!node_modules/**' ':!.venv/**' ':!**/*.db' ':!**/__pycache__/**' ':!**/.pytest_cache/**' ':!.github/workflows/**'\")")
          s = s.replace('globalThis.crypto = crypto.webcrypto;\n', '')
          s = s.replace('"minutes": {"type": "integer", "minimum": 1},\n            "qs":', '"minutes": {"type": "integer", "minimum": 1},\n            "topics": {"type": "array", "items": {"type": "string", "minLength": 1}},\n            "qs":')
          s = s.replace('    PRAGMA foreign_keys = ON;\n\n', '')
          s = s.replace('      description: Future private backend contract. No server is deployed by this repository.\n', '      description: Future private backend contract. No server is deployed by this repository.\n      license:\n        name: MIT\n        identifier: MIT\n')
          s = s.replace('    components:\n      parameters:', '    components:\n      securitySchemes:\n        AnonId:\n          type: apiKey\n          in: header\n          name: X-Anon-Id\n      parameters:')
          replacements = {
              '          operationId: health\n': "          operationId: health\n          summary: Check service liveness\n          security: []\n",
              '          operationId: getBank\n': "          operationId: getBank\n          summary: Load the full study bank\n          security: [{ AnonId: [] }]\n",
              '          operationId: getProgress\n': "          operationId: getProgress\n          summary: Load anonymous progress\n          security: [{ AnonId: [] }]\n",
              '          operationId: putProgress\n': "          operationId: putProgress\n          summary: Replace anonymous progress\n          security: [{ AnonId: [] }]\n",
              '          operationId: postFeedback\n': "          operationId: postFeedback\n          summary: Submit anonymous question feedback\n          security: [{ AnonId: [] }]\n",
              '          operationId: postEvents\n': "          operationId: postEvents\n          summary: Submit anonymous event batch\n          security: [{ AnonId: [] }]\n",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          old_validator = """    from jsonschema import Draft7Validator, FormatChecker\n\n    ROOT = Path(__file__).resolve().parents[2]\n    SCHEMA_DIR = ROOT / 'data' / 'schema'\n    DATA_DIR = ROOT / 'data'\n    RATE = defaultdict(deque)\n\n    def load_schema(name):\n        return json.loads((SCHEMA_DIR / name).read_text(encoding='utf-8'))\n\n    VALIDATORS = {\n        'state': Draft7Validator(load_schema('state.schema.json'), format_checker=FormatChecker()),\n        'feedback': Draft7Validator(load_schema('feedback.schema.json'), format_checker=FormatChecker()),\n        'events': Draft7Validator(load_schema('events.schema.json'), format_checker=FormatChecker()),\n    }\n"""
          new_validator = """    from jsonschema import Draft7Validator, FormatChecker, RefResolver\n\n    ROOT = Path(__file__).resolve().parents[2]\n    SCHEMA_DIR = ROOT / 'data' / 'schema'\n    DATA_DIR = ROOT / 'data'\n    RATE = defaultdict(deque)\n\n    def load_schema(name):\n        return json.loads((SCHEMA_DIR / name).read_text(encoding='utf-8'))\n\n    def make_validator(name):\n        schema = load_schema(name)\n        resolver = RefResolver(base_uri=SCHEMA_DIR.resolve().as_uri() + '/', referrer=schema)\n        return Draft7Validator(schema, resolver=resolver, format_checker=FormatChecker())\n\n    VALIDATORS = {\n        'state': make_validator('state.schema.json'),\n        'feedback': make_validator('feedback.schema.json'),\n        'events': make_validator('events.schema.json'),\n    }\n"""
          if old_validator not in s:
              raise SystemExit('server validator patch anchor not found')
          s = s.replace(old_validator, new_validator, 1)
          old_read = '    server_workflow = (ROOT / ".github/workflows/server-tests.yml").read_text(encoding="utf-8")\n'
          fallback = '''    server_workflow_path = ROOT / ".github/workflows/server-tests.yml"\n    if not server_workflow_path.exists():\n        write(".github/workflows/server-tests.yml", """\n    name: Server tests\n    on:\n      push:\n      pull_request:\n    permissions:\n      contents: read\n    jobs:\n      test:\n        runs-on: ubuntu-latest\n        steps:\n          - uses: actions/checkout@v6\n          - uses: actions/setup-python@v6\n            with: { python-version: '3.12' }\n          - name: Install server dependencies\n            run: pip install -r server/requirements.txt\n          - name: Run server tests\n            working-directory: server\n            run: pytest -q\n          - name: SQLite schema smoke test\n            run: python3 scripts/db_smoke.py\n    """)\n    server_workflow = server_workflow_path.read_text(encoding="utf-8")\n'''
          if old_read not in s:
              raise SystemExit('task 6 server workflow anchor not found')
          s = s.replace(old_read, fallback, 1)
          s = s.replace("run(\"gh api -X POST repos/$GITHUB_REPOSITORY/labels -f name=question-report -f color=1d76db >/dev/null 2>&1 || gh api repos/$GITHUB_REPOSITORY/labels/question-report >/dev/null\")", "run(\"if ! gh api -X POST repos/$GITHUB_REPOSITORY/labels -f name=question-report -f color=1d76db >/dev/null 2>&1; then gh api repos/$GITHUB_REPOSITORY/labels/question-report >/dev/null; fi\")")
          s = s.replace("run(\"gh api -X POST repos/$GITHUB_REPOSITORY/labels -f name=needs-triage -f color=fbca04 >/dev/null 2>&1 || gh api repos/$GITHUB_REPOSITORY/labels/needs-triage >/dev/null\")", "run(\"if ! gh api -X POST repos/$GITHUB_REPOSITORY/labels -f name=needs-triage -f color=fbca04 >/dev/null 2>&1; then gh api repos/$GITHUB_REPOSITORY/labels/needs-triage >/dev/null; fi\")")
          s = s.replace("    task1(); task2(); task3(); task4(); task5(); task6(); task7(); task8(); task9(); task10()", "    completed = run(\"git log --format=%s e715c688900c7b0259143c6ea8d74eb6fba93575..HEAD\").stdout.splitlines()\n    tasks = [(task1, 'Add storage interface and browser adapter'), (task2, 'Add versioned anonymous state schema'), (task3, 'Define future v1 OpenAPI contract'), (task4, 'Add portable database schema'), (task5, 'Add tested FastAPI server skeleton'), (task6, 'Add API storage adapter and shared contract tests'), (task7, 'Replace question reports with GitHub Issue Form'), (task8, 'Add least-privilege daily review proposal workflow'), (task9, 'Harden Pages validation and live release gates'), (task10, 'Document server-ready architecture and operations')]\n    for function, message in tasks:\n        if message in completed:\n            print(f'SKIP_COMPLETED={message}')\n            continue\n        function()")
          needle = "    main_script, pwa_script = scripts[0], scripts[1]\n"
          replacement = needle + "    pwa_script = pwa_script.replace(\"localStorage.getItem('pwaInstallDismissed') !== '1'\", \"globalThis.__pwaInstallDismissed !== true\")\n    pwa_script = pwa_script.replace(\"try{ localStorage.setItem('pwaInstallDismissed','1'); }catch(e){}\", \"globalThis.__pwaInstallDismissed = true;\")\n"
          if needle not in s:
              raise SystemExit('builder patch anchor not found')
          s = s.replace(needle, replacement, 1)
          if '|| true' in s:
              raise SystemExit('patched builder still contains forbidden || true')
          Path('/tmp/server_ready_builder.py').write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile /tmp/server_ready_builder.py

      - name: Run builder
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: server-ready-foundation
        run: python3 /tmp/server_ready_builder.py .
