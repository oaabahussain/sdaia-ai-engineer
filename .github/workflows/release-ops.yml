name: Release task 6

on:
  push:
    branches: [release-ops]

permissions:
  contents: write
  actions: write

jobs:
  task6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v6
        with:
          ref: release-ops
          fetch-depth: 0

      - name: Checkout main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B work-main origin/main

      - name: Add per-question reporting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/ISSUE_TEMPLATE
          cat > .github/ISSUE_TEMPLATE/question-report.md <<'EOF'
          ---
          name: Report a question
          about: Report an incorrect, unclear, or outdated study question
          title: "Question report: "
          labels: ""
          assignees: ""
          ---

          Question ID:

          Describe the problem:

          Suggested correction or source, if available:
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          css_marker = ".noteBox{width:100%;min-height:90px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px}.book{font-size:18px}"
          if css_marker not in text:
              raise SystemExit("Report-link CSS marker not found")
          text = text.replace(
              css_marker,
              css_marker + ".reportLink{display:inline-block;margin-top:7px;font-size:11px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}",
              1,
          )

          card_marker = '<div class="qtext" id="qtext"></div><div class="opts" id="opts"></div>'
          if card_marker not in text:
              raise SystemExit("Study question card marker not found")
          text = text.replace(
              card_marker,
              '<div class="qtext" id="qtext"></div><a class="reportLink" id="reportQuestionLink" target="_blank" rel="noopener">Report a question</a><div class="opts" id="opts"></div>',
              1,
          )

          binding_marker = "bookmarkBtn=$('bookmarkBtn'), feedback=$('feedback'), qnote=$('qnote'),"
          if binding_marker not in text:
              raise SystemExit("Question link DOM binding marker not found")
          text = text.replace(
              binding_marker,
              "bookmarkBtn=$('bookmarkBtn'), reportQuestionLink=$('reportQuestionLink'), feedback=$('feedback'), qnote=$('qnote'),",
              1,
          )

          qbyid_marker = "function qById(id){return QUESTIONS.find(q=>q.id===id)}"
          if qbyid_marker not in text:
              raise SystemExit("qById marker not found")
          helper = r'''function qById(id){return QUESTIONS.find(q=>q.id===id)}
          function questionReportUrl(id){
            const params=new URLSearchParams({
              template:'question-report.md',
              title:`Question report: ${id}`,
              body:`Question ID: ${id}\n\nDescribe the problem:\n`
            });
            return `https://github.com/oaabahussain/sdaia-ai-engineer/issues/new?${params.toString()}`;
          }'''
          text = text.replace(qbyid_marker, helper, 1)

          diagnostic_marker = '<div class="qcard"><div class="qtext">${q.question}</div><div class="opts">${q.options.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join(\'\')}</div>'
          if diagnostic_marker not in text:
              raise SystemExit("Diagnostic question template marker not found")
          diagnostic_replacement = '<div class="qcard"><div class="qtext">${q.question}</div><a class="reportLink" href="${questionReportUrl(q.id)}" target="_blank" rel="noopener">Report a question</a><div class="opts">${q.options.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join(\'\')}</div>'
          text = text.replace(diagnostic_marker, diagnostic_replacement, 1)

          study_marker = "const q=qById(active.ids[active.index]);active.selected=null;active.confidence=null;active.shownLearn=false;"
          if study_marker not in text:
              raise SystemExit("Study render marker not found")
          text = text.replace(
              study_marker,
              "const q=qById(active.ids[active.index]);reportQuestionLink.href=questionReportUrl(q.id);active.selected=null;active.confidence=null;active.shownLearn=false;",
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq "questionReportUrl" index.html
          grep -Fq "Report a question" index.html
          grep -Fq "Question ID:" .github/ISSUE_TEMPLATE/question-report.md
          python3 scripts/verify_release.py index.html

      - name: Commit task 6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oaabahussain"
          git config user.email "147952589+oaabahussain@users.noreply.github.com"
          git add index.html .github/ISSUE_TEMPLATE/question-report.md
          if git diff --cached --quiet; then
            echo "Task 6 produced no changes"
            exit 1
          fi
          git commit -m "Add per-question reporting workflow"
          git push origin HEAD:main

      - name: Dispatch Pages verification
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "Pages workflow dispatched for main."
