name: K3 isolated integration audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: dd3ece1cc6434b43b495dd97ca904748b4bc5393
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Capture authenticated source and baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k3-recovery /tmp/k3-baseline
          test "$(git rev-parse HEAD)" = dd3ece1cc6434b43b495dd97ca904748b4bc5393
          git fetch origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$LIVE_MAIN" = 559e46a21cd1fe4006158f9ae14f96400a4568f2
          git update-ref refs/heads/main "$LIVE_MAIN"
          git update-ref refs/heads/impl/k3-learner-evidence-engine HEAD
          git bundle create /tmp/k3-recovery/repository.bundle refs/heads/main refs/heads/impl/k3-learner-evidence-engine
          git bundle verify /tmp/k3-recovery/repository.bundle
          git rev-parse HEAD HEAD^{tree} origin/main > /tmp/k3-recovery/source-refs.txt
          git show origin/main:package.json > /tmp/k3-baseline/package.json
          git show origin/main:package-lock.json > /tmp/k3-baseline/package-lock.json
      - name: Audit dependency locks without automatic changes
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --json > /tmp/k3-recovery/audit-candidate.json
          echo "$?" > /tmp/k3-recovery/audit-candidate.exit
          npm audit --package-lock-only --omit=dev --json > /tmp/k3-recovery/audit-production.json
          echo "$?" > /tmp/k3-recovery/audit-production.exit
          npm audit --prefix /tmp/k3-baseline --package-lock-only --json > /tmp/k3-recovery/audit-baseline.json
          echo "$?" > /tmp/k3-recovery/audit-baseline.exit
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('candidate', 'production', 'baseline'):
              report = json.loads(Path(f'/tmp/k3-recovery/audit-{name}.json').read_text())
              assert 'metadata' in report and 'vulnerabilities' in report, report
              print(name, json.dumps(report['metadata'], sort_keys=True))
          PY
      - name: Package lock-consistent dependencies for offline verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          tar -czf /tmp/k3-recovery/node-modules.tar.gz node_modules
          mkdir /tmp/k3-recovery/wheelhouse
          python3 -m pip download --only-binary=:all: -r server/requirements.txt -d /tmp/k3-recovery/wheelhouse
          cd /tmp/k3-recovery
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: k3-authenticated-integration-evidence
          path: /tmp/k3-recovery/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
