name: Pull request quality gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate canonical track contracts
        run: npm run validate
      - name: Run Node tests
        run: npm test
      - name: Generate governed current-bank migration artifact
        run: |
          rm -rf /tmp/k1-factory
          node scripts/platform-kernel/import_current_bank.js /tmp/k1-factory
      - uses: actions/upload-artifact@v4
        with:
          name: k1-factory-generated
          path: /tmp/k1-factory
          if-no-files-found: error
      - name: Persist generated K1 artifacts once
        if: github.event_name == 'pull_request' && github.head_ref == 'impl/k1-content-factory-governance-core'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          rm -rf data/factory/migrations data/factory/knowledge data/factory/sources data/factory/releases
          node scripts/platform-kernel/import_current_bank.js data/factory
          git add data/factory
          if git diff --cached --quiet; then
            echo "K1 factory artifacts already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: persist K1 current-bank lineage"
          git push origin "HEAD:$BRANCH"
      - name: Parse application module
        run: node --check src/app.js
      - name: Verify service worker shell assets
        run: npm run verify:sw
      - name: Verify Pages artifact assembly
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html feedback.html manifest.webmanifest sw.js icon.svg icon-180.png icon-192.png icon-512.png _site/
          cp -R src tracks _site/
          mkdir -p _site/data
          cp -R data/concepts data/migrations _site/data/
          cp data/learn.json data/cases.json _site/data/
          test ! -e _site/data/legacy
          test -f _site/tracks/registry.json
          touch _site/.nojekyll
          node --check _site/src/app.js
          node scripts/verify_html.js _site/index.html
          node scripts/verify_sw_assets.js _site
          python3 -m http.server 4174 --bind 127.0.0.1 --directory _site > /tmp/pages-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4174/index.html >/dev/null; then break; fi
            if [ "$attempt" -eq 20 ]; then cat /tmp/pages-preview.log; exit 1; fi
            sleep 1
          done
          node scripts/verify_live_release.js http://127.0.0.1:4174
          kill "$preview_pid"
          trap - EXIT
      - name: Browser smoke test
        run: python3 scripts/browser_smoke.py
