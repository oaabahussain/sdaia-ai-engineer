name: Pull request quality gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate canonical track contracts
        run: npm run validate
      - name: Run Node tests
        run: npm test
      - name: Verify deterministic execution control plane
        run: npm run process:verify
      - name: Validate K3 execution state against PR base
        if: github.event_name == 'pull_request'
        env:
          LIVE_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run validate:state -- --live-main-sha "$LIVE_MAIN_SHA" --json
      - name: Verify governed current-bank migration
        run: npm run verify:factory-import
      - name: Parse application module
        run: node --check src/app.js
      - name: Verify service worker shell assets
        run: npm run verify:sw
      - name: Verify Pages artifact assembly
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_pages_artifact.js _site
          node --check _site/src/app.js
          node scripts/verify_html.js _site/index.html
          node scripts/verify_sw_assets.js _site
          python3 -m http.server 4174 --bind 127.0.0.1 --directory _site > /tmp/pages-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4174/index.html >/dev/null; then break; fi
            if [ "$attempt" -eq 20 ]; then cat /tmp/pages-preview.log; exit 1; fi
            sleep 1
          done
          node scripts/verify_live_release.js http://127.0.0.1:4174
          kill "$preview_pid"
          trap - EXIT
      - name: Browser smoke test
        run: python3 scripts/browser_smoke.py
