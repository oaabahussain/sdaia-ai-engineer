name: Level 0 verification

on:
  push:
    branches: [impl/level-0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate data and schemas
        run: node scripts/validate.js
      - name: Run Node tests
        run: node --test tests/*.test.js
      - name: Run browser adapter contract
        run: node scripts/contract_test.js browser
      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-180.png icon-192.png icon-512.png _site/
          cp -R src data _site/
          touch _site/.nojekyll
          node scripts/verify_html.js _site/index.html
          node scripts/verify_sw_assets.js _site
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify committed Level 0 browser smoke
        run: npx playwright test tests/e2e/boot.spec.js
      - name: Upload Level 0 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-0-screenshots
          path: docs/screens/level-0/
          if-no-files-found: error
