name: Level 0 bootstrap implementation

on:
  push:
    branches: [impl/level-0]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[level0-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/level-0
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply minimal TDZ fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          old = "let state=migrateState((await loadState())||{});\nconst nowIso=()=>new Date().toISOString();\nconst uuidV4=()=>globalThis.crypto?.randomUUID?.() ?? '00000000-0000-4000-8000-'+Math.random().toString(16).slice(2,14).padEnd(12,'0').slice(0,12);"
          new = "const nowIso=()=>new Date().toISOString();\nconst uuidV4=()=>globalThis.crypto?.randomUUID?.() ?? '00000000-0000-4000-8000-'+Math.random().toString(16).slice(2,14).padEnd(12,'0').slice(0,12);\nlet state=migrateState((await loadState())||{});"
          if old not in s:
              raise SystemExit('Expected TDZ sequence not found; refusing workaround')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff -- src/app.js

      - name: Add Playwright dependency
        run: npm install --save-dev @playwright/test@latest

      - name: Create Level 0 Playwright configuration and smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/e2e docs/screens/level-0
          cat > playwright.config.js <<'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './tests/e2e',
            timeout: 45_000,
            retries: 0,
            workers: 1,
            reporter: [['line']],
            use: {
              baseURL: 'http://127.0.0.1:4173',
              trace: 'retain-on-failure',
            },
            webServer: {
              command: 'python3 -m http.server 4173 -d _site',
              url: 'http://127.0.0.1:4173',
              reuseExistingServer: false,
              timeout: 30_000,
            },
            projects: [
              {
                name: 'chromium-mobile',
                use: { ...devices['Desktop Chrome'], viewport: { width: 390, height: 844 } },
              },
              {
                name: 'chromium-desktop',
                use: { ...devices['Desktop Chrome'], viewport: { width: 1280, height: 800 } },
              },
              {
                name: 'webkit-mobile',
                use: { ...devices['Desktop Safari'], viewport: { width: 390, height: 844 } },
              },
            ],
          });
          EOF

          cat > tests/e2e/boot.spec.js <<'EOF'
          import { test, expect } from '@playwright/test';
          import fs from 'node:fs';

          const STATE_KEY = 'sdaia.state.v1';
          const uuidV4 = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

          test('Level 0 boot, entry, persistence and zero runtime errors', async ({ page }, testInfo) => {
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });

            await page.goto('/index.html', { waitUntil: 'networkidle' });
            await expect(page.locator('#enterBtn')).toBeVisible();
            await page.screenshot({ path: `docs/screens/level-0/${testInfo.project.name}-welcome.png`, fullPage: true });

            await page.locator('#enterBtn').click();
            await expect(page.locator('#onboarding')).toHaveClass(/active/);
            await page.locator('#startMode').selectOption('plan');
            await page.locator('#finishOnboard').click();

            const state = await page.evaluate(key => {
              const raw = localStorage.getItem(key);
              return raw ? JSON.parse(raw) : null;
            }, STATE_KEY);
            expect(state).not.toBeNull();
            expect(state.anon_id).toMatch(uuidV4);
            expect(state.onboarded).toBe(true);

            await page.reload({ waitUntil: 'networkidle' });
            const reloaded = await page.evaluate(key => JSON.parse(localStorage.getItem(key)), STATE_KEY);
            expect(reloaded.anon_id).toBe(state.anon_id);
            expect(reloaded.onboarded).toBe(true);
            await page.screenshot({ path: `docs/screens/level-0/${testInfo.project.name}-after-reload.png`, fullPage: true });

            expect(pageErrors, `pageerror: ${pageErrors.join(' | ')}`).toEqual([]);
            expect(consoleErrors, `console.error: ${consoleErrors.join(' | ')}`).toEqual([]);
          });
          EOF

      - name: Make Level 0 smoke blocking before Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pages.yml')
          s = p.read_text()
          needle = "      - uses: actions/configure-pages@v5\n"
          block = "      - name: Install Playwright browsers\n        run: npx playwright install --with-deps chromium webkit\n      - name: Run Level 0 browser smoke\n        run: npx playwright test tests/e2e/boot.spec.js --reporter=line\n"
          if block not in s:
              if needle not in s:
                  raise SystemExit('Pages insertion point missing')
              s = s.replace(needle, block + needle, 1)
          p.write_text(s)
          PY
          git diff -- .github/workflows/pages.yml

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-180.png icon-192.png icon-512.png _site/
          cp -R src data _site/
          touch _site/.nojekyll
          node scripts/verify_html.js _site/index.html
          node scripts/verify_sw_assets.js _site

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: List Level 0 browser smoke tests
        run: npx playwright test --list tests/e2e/boot.spec.js

      - name: Run Level 0 browser smoke
        run: npx playwright test tests/e2e/boot.spec.js --reporter=line

      - name: Record exact verification commands and outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reports
          {
            echo 'LEVEL 0 BOOTSTRAP VERIFICATION'
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo
            echo '$ git diff --check'
            git diff --check
            echo 'PASS'
            echo
            echo '$ node --check src/app.js'
            node --check src/app.js
            echo 'PASS'
            echo
            echo '$ node scripts/validate.js'
            node scripts/validate.js
            echo
            echo '$ node --test tests/*.test.js'
            node --test tests/*.test.js
            echo
            echo '$ npx playwright test --list tests/e2e/boot.spec.js'
            npx playwright test --list tests/e2e/boot.spec.js
            echo
            echo '$ npx playwright test tests/e2e/boot.spec.js --reporter=line'
            npx playwright test tests/e2e/boot.spec.js --reporter=line
          } | tee docs/reports/level-0-bootstrap.txt

      - name: Commit verified Level 0 implementation slice
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/level0-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js package.json package-lock.json playwright.config.js tests/e2e/boot.spec.js .github/workflows/pages.yml docs/screens/level-0 docs/reports/level-0-bootstrap.txt .github/workflows/level0-bootstrap.yml
          git diff --cached --check
          git commit -m 'feat(level-0): verify startup and block deploy on browser smoke [level0-final]'
          git push origin HEAD:impl/level-0
