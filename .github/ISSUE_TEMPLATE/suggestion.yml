name: Suggestion
description: Suggest an improvement to the study site or question bank
title: "[Suggestion] "
labels: []
assignees: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Questions or explanations
        - Arabic or English translation
        - Exam experience
        - Mobile or accessibility
        - New feature
        - Other
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: Describe the improvement and why it would help learners.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source or evidence
      description: Add a source when the suggestion depends on a technical or factual claim.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public submission
      options:
        - label: I understand this issue is public and contains no personal or confidential information.
          required: true
