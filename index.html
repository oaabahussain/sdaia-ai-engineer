<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>SDAIA AI Engineer</title>
<style>
html,body{height:100%;margin:0;background:#07101c;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
main{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.spinner{width:34px;height:34px;border:3px solid #22334a;border-top-color:#60a5fa;border-radius:50%;animation:s 1s linear infinite;margin:auto auto 14px}@keyframes s{to{transform:rotate(360deg)}}small{color:#9eafc5}
</style>
</head>
<body><main><div><div class="spinner"></div><b>جاري تشغيل مساحة المذاكرة…</b><br><small id="status">تحميل التطبيق</small></div></main>
<script>
(async()=>{
 const parts=[0,1,2,3,4,5].map(n=>`./parts/app.gz.b64.part-${String(n).padStart(2,'0')}`);
 try{
   if(typeof DecompressionStream==='undefined') throw new Error('unsupported');
   const res=await Promise.all(parts.map(u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u);return r.text()})));
   const b64=res.join('');
   const raw=atob(b64), bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const app=await new Response(stream).text();
   document.open();document.write(app);document.close();
 }catch(e){document.getElementById('status').textContent='تعذر تحميل التطبيق. افتح الصفحة في Safari حديث ثم أعد المحاولة.'}
})();
</script></body></html>
